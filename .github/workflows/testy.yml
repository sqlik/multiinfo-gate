# Testy, sprawdzenie typów i kontrola tekstu przy każdej zmianie na main i w każdym pull requeście.
name: Testy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run check:tekst
