# Wydanie: tag v1.2.3 na main buduje obraz dla amd64 i arm64, publikuje go w GitHub Container
# Registry jako ghcr.io/sqlik/multiinfo-gate:1.2.3, :1.2 i :1 (oraz :latest) i tworzy release
# na GitHubie z opisem wziętym z treści tagu (git tag -a). Numer tagu musi zgadzać się z wersją
# w package.json - to ona trafia do masztu panelu i /healthz.
name: Wydanie

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Uprawnienia tokenu tylko tam, gdzie są potrzebne: testy nic nie zapisują, obraz idzie
# do rejestru pakietów, release zapisuje w repozytorium.
permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run check:tekst
      - name: Tag zgodny z wersją w package.json
        run: |
          wersja="v$(node -p "require('./package.json').version")"
          if [ "$wersja" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, a package.json mówi $wersja" >&2
            exit 1
          fi

  obraz:
    needs: testy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Multiinfo Gate
            org.opencontainers.image.description=Bramka SMS między aplikacjami a API Multiinfo (Plus, Polkomtel)
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Bez atestacji pochodzenia: BuildKit dokłada ją do indeksu jako wpis bez platformy,
          # który GitHub pokazuje jako trzecią architekturę "unknown/unknown".
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: obraz
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Release z opisem z tagu i danymi obrazu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout pobiera tag jako sam commit; treść tagu adnotowanego trzeba dociągnąć osobno
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          wersja="${GITHUB_REF_NAME#v}"
          obraz="ghcr.io/${{ github.repository }}:$wersja"
          platformy=$(docker buildx imagetools inspect "$obraz" \
            --format '{{range .Manifest.Manifests}}{{if ne .Platform.OS "unknown"}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}')
          {
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
            echo
            echo "**Obraz kontenera:** \`docker pull $obraz\` - $(echo $platformy | sed 's/ /, /g')"
            echo "(jeden tag dla obu architektur; Docker pobiera wariant właściwy dla serwera). Tagi \`${wersja%.*}\` i \`${wersja%%.*}\` wskazują to samo wydanie."
          } > opis-wydania.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file opis-wydania.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Multiinfo Gate $wersja" --notes-file opis-wydania.md
          fi
