# Wariant B: nginx na hoście przed bramką w Dockerze (port 8080 opublikowany na 127.0.0.1).
# Kopiowanie: sudo cp docker/nginx/multiinfo-gate.conf /etc/nginx/sites-available/multiinfo-gate
# i podmiana <TWOJA-DOMENA>. HTTPS dokłada certbot (python3-certbot-nginx) - docs/uruchomienie.md.
server {
    listen 80;
    listen [::]:80;
    server_name <TWOJA-DOMENA>;

    # Body żądania API to najwyżej 512 KB (limit bramki); 1m zostawia zapas na nagłówki.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Odpowiedzi są małe i natychmiastowe - buforowanie tylko opóźnia.
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
