# Wariant B ze skracaczem: domeny krótkich linków przez nginx na hoście do portu przekierowań bramki
# (127.0.0.1:8082 z docker-compose.nginx.yml albo MIG_LINKS_PORT w kontenerze LXC).
# Kopiowanie: sudo cp docker/nginx/multiinfo-gate-linki.conf /etc/nginx/sites-available/multiinfo-gate-linki
# i podmiana <DOMENY-SKRACACZA> na domeny skracacza z panelu bramki, rozdzielone spacją. HTTPS dokłada
# certbot (python3-certbot-nginx) z przekierowaniem HTTP na HTTPS, potrzebnym dla linków bez schematu.
server {
    listen 80;
    listen [::]:80;
    server_name <DOMENY-SKRACACZA>;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        # Bramka rozpoznaje domenę skracacza po nagłówku Host.
        proxy_set_header Host $host;
        # Limit wejść liczony na adres odbiorcy wymaga MIG_TRUSTED_PROXIES z adresem, z którego nginx
        # łączy się z bramką (docs/uruchomienie.md, rozdział 6.5).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Odpowiedzią jest przekierowanie albo krótka strona - buforowanie tylko opóźnia.
        proxy_buffering off;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }
}
